<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>文章管理</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>


<body>

<div class="content">
    <h1>博客管理</h1>
    <a href="/admin/article/create"><button>新增文章</button></a>
        <table>
            <tr>
                <th>标题</th>
                <th>分类</th>
                <th>时间</th>
                <th>操作</th>
            </tr>

            <tr th:each="article:${articles}">
                <td th:text="${article.title}">标题</td>
                <td th:text="${article.category}">AI</td>
                <td th:text="${article.createTime}">时间</td>
                <td>
                    <a th:href="@{'/admin/article/edit/' + ${article.id}}">编辑</a>
                </td>
            </tr>
        </table>
</div>

</body>

</html>
