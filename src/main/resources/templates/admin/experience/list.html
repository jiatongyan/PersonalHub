<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>工作经历管理</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>


<body>

<div class="content">
    <h1>工作经历管理</h1>
    <a href="/admin/dashboard"><button class="secondary">← 返回 Dashboard</button></a>
    <a href="/admin/experience/create"><button>新增经历</button></a>
    <table>
        <tr>
            <th>公司</th>
            <th>部门</th>
            <th>职位</th>
            <th>起止时间</th>
            <th>操作</th>
        </tr>

        <tr th:each="experience:${experiences}">
            <td th:text="${experience.company}">公司</td>
            <td th:text="${experience.department}">部门</td>
            <td th:text="${experience.position}">职位</td>
            <td>
                <span th:text="${#temporals.format(experience.startTime, 'yyyy-MM-dd')}">2025-07-01</span>
                -
                <span th:if="${experience.endTime != null}"
                      th:text="${#temporals.format(experience.endTime, 'yyyy-MM-dd')}">2026-07-01</span>
                <span th:if="${experience.endTime == null}">至今</span>
            </td>
            <td>
                <a th:href="@{'/admin/experience/edit/' + ${experience.id}}">编辑</a>
                <form th:action="@{'/admin/experience/delete/' + ${experience.id}}"
                      method="post"
                      style="display:inline"
                      onsubmit="return confirm('确定要删除这条工作经历吗？');">
                    <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
                    <button type="submit">删除</button>
                </form>
            </td>
        </tr>
    </table>
</div>

</body>

</html>
