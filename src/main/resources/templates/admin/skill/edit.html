<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>技能编辑</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="content">
    <h1 th:text="${skill.id == null ? '新增技能' : '编辑技能'}">新增技能</h1>
    <a href="/admin/dashboard"><button class="secondary">← 返回 Dashboard</button></a>

    <form method="post" action="/admin/skill/save">
        <input type="hidden" name="id" th:value="${skill.id}">
        <input type="hidden" name="_csrf" th:value="${session.csrfToken}">

        <label>技能名称</label>
        <br><br>
        <input name="name" th:value="${skill.name}"
               placeholder="技能名称，例如 Java"
               style="width:100%;padding:15px">
        <br><br>

        <label>分类</label>
        <br><br>
        <input name="category" th:value="${skill.category}"
               placeholder="分类，例如 Backend / Frontend / AI"
               style="width:100%;padding:15px">
        <br><br>

        <label>等级（1 - 5，首页会显示对应数量的 ⭐）</label>
        <br><br>
        <input type="number" name="level" min="1" max="5"
               th:value="${skill.level}"
               placeholder="1 - 5"
               style="width:100%;padding:15px">
        <br><br>

        <label>技能描述</label>
        <br><br>
        <textarea name="description" th:text="${skill.description}"
                  placeholder="技能描述"
                  style="width:100%;padding:15px"></textarea>
        <br><br>

        <button>保存</button>
    </form>
</div>

</body>
</html>
