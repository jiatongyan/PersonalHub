spring.application.name=personalhub

# 数据库连接
spring.datasource.url=jdbc:mysql://localhost:3306/personalhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# MyBatis配置
# mapper xml位置
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类包
mybatis.type-aliases-package=com.dylan.personalhub.entity
# 开启SQL日志
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 开启驼峰命名映射
mybatis.configuration.map-underscore-to-camel-case=true

# 上传文件大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB